name: Fix Moon and Wind Display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix moon and wind display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/weather-command-center.js')
          s = p.read_text()

          # Make the lunar panel a definite foreground element and move it slightly
          # lower so it sits cleanly in the empty hero/header area.
          s = re.sub(
              r'\.moon-panel\{[^}]*\}',
              '.moon-panel{position:absolute;top:76px;right:24px;width:410px;min-height:138px;padding:14px 16px;border-radius:18px;background:rgba(7,18,30,.48);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px);box-sizing:border-box;z-index:20!important;display:block!important;box-shadow:0 10px 30px rgba(0,0,0,.16)}',
              s, count=1
          )

          # Improve readability of the compass readout.
          s = re.sub(
              r'\.read\{[^}]*\}',
              '.read{text-align:center;font-size:13px;font-weight:600;letter-spacing:.02em;opacity:1;margin-top:-9px;position:relative;z-index:10;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);background:rgba(4,12,22,.42);border:1px solid rgba(255,255,255,.10);border-radius:9px;padding:6px 10px;display:inline-block;left:50%;transform:translateX(-50%);white-space:nowrap}',
              s, count=1
          )

          # The existing arrow represents the numeric bearing as a vector TO the
          # bearing. Meteorological wind direction is the direction FROM which the
          # wind originates, so reverse the arrow 180 degrees while keeping the
          # displayed bearing unchanged.
          s = s.replace(
              '.arrow{stroke:#fff;stroke-width:4;stroke-linecap:round}',
              '.arrow{stroke:#fff;stroke-width:4;stroke-linecap:round;transform:rotate(180deg);transform-box:fill-box;transform-origin:center}'
          )

          # Replace the lunar updater with a more robust version. It inserts the
          # panel directly into the shell and retries after rendering, avoiding the
          # race where Home Assistant can finish the first render one frame later.
          new_moon = '''updateMoonPanel(){if(!this.root)return;const put=()=>{const shell=this.root.querySelector('.shell');if(!shell)return false;let el=shell.querySelector('.moon-panel');if(!el){el=document.createElement('div');el.className='moon-panel z';shell.appendChild(el)}const m=this.moonInfo();el.innerHTML=`<div class="moon-head"><div class="moon-title">MOON & ATMOSPHERE</div><div class="sub">LIVE ASTRONOMICAL DATA</div></div><div class="moon-phase"><div class="moon-icon">${m.icon}</div><div><div class="moon-name">${m.name}</div><div class="moon-sub">${m.percent}% illuminated · Moon age ${m.age.toFixed(1)} days</div></div></div><div class="moon-stats"><div class="moon-stat"><span>Illumination</span><strong>${m.percent}%</strong></div><div class="moon-stat"><span>Age</span><strong>${m.age.toFixed(1)} days</strong></div><div class="moon-stat"><span>Next ${m.next}</span><strong>~${m.daysToNext}</strong></div></div>`;return true};if(!put()){requestAnimationFrame(()=>put())}setTimeout(put,100)}
'''
          s, n = re.subn(r'updateMoonPanel\(\)\{.*?\}\nids\(\)', new_moon + 'ids()', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate updateMoonPanel method')

          # Add an explicit meteorological readout beneath the compass.
          wind_method = '''updateWindRead(){const ids=this.ids(),d=this.n(ids.wd),sp=this.n(ids.ws),el=this.root?.querySelector('.read');if(!el)return;if(d===null){el.textContent='—'}else{const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];const dir=dirs[Math.round(d/22.5)%16];el.textContent=sp===null?`FROM ${dir} · ${Math.round(d)}°`:`FROM ${dir} · ${Math.round(d)}° · ${sp.toFixed(1)} km/h`}}
'''
          s, n = re.subn(r'ids\(\)\{', wind_method + 'ids(){', s, count=1)
          if n != 1:
              raise SystemExit('Could not locate ids method')

          old = "set hass(h){this.h=h;if(!this.rendered){this.render();this.rendered=true;this.updateMoonPanel();this.loadForecast();this.loadRadar()}else{this.update();this.updateMoonPanel()}}"
          new = "set hass(h){this.h=h;if(!this.rendered){this.render();this.rendered=true;this.updateMoonPanel();this.updateWindRead();this.loadForecast();this.loadRadar()}else{this.update();this.updateMoonPanel();this.updateWindRead()}}"
          if old not in s:
              raise SystemExit('Could not locate set hass method')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          node --check src/weather-command-center.js
          node scripts/build.mjs
          node --check dist/weather-command-center.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/weather-command-center.js dist/weather-command-center.js
          git commit -m "Fix moon and wind display"
          git push