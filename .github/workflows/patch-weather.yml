name: Patch Weather Command Center
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[weather-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/weather-command-center.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.map img{width:100%;height:100%;display:block;object-fit:cover}', '.map img,.map iframe{width:100%;height:100%;display:block;border:0}.map iframe{background:#263747}')

          old="temperature_entity:c.temperature_entity||w.temperature,humidity_entity:c.humidity_entity||w.humidity,pressure_entity:c.pressure_entity||w.pressure,wind_speed_entity:c.wind_speed_entity||w.wind_speed,wind_direction_entity:c.wind_direction_entity||w.wind_direction,wind_gust_entity:c.wind_gust_entity||w.wind_gust,uv_entity:c.uv_entity||w.uv,dew_point_entity:c.dew_point_entity||w.dew_point,feels_like_entity:c.feels_like_entity||w.feels_like,rain_rate_entity:c.rain_rate_entity||w.rain_rate,rain_24h_entity:c.rain_24h_entity||w.rain_24h,solar_entity:c.solar_entity||w.solar,"
          new="temperature_entity:c.temperature_entity||w.temperature||'sensor.gw2000b_outdoor_temperature',humidity_entity:c.humidity_entity||w.humidity||'sensor.gw2000b_humidity',pressure_entity:c.pressure_entity||w.pressure||'sensor.gw2000b_relative_pressure',wind_speed_entity:c.wind_speed_entity||w.wind_speed||'sensor.gw2000b_wind_speed',wind_direction_entity:c.wind_direction_entity||w.wind_direction||'sensor.gw2000b_wind_direction',wind_gust_entity:c.wind_gust_entity||w.wind_gust||'sensor.gw2000b_wind_gust',uv_entity:c.uv_entity||w.uv||'sensor.gw2000b_uv_index',dew_point_entity:c.dew_point_entity||w.dew_point||'sensor.gw2000b_dewpoint',feels_like_entity:c.feels_like_entity||w.feels_like||'sensor.gw2000b_feels_like_temperature',rain_rate_entity:c.rain_rate_entity||w.rain_rate||'sensor.gw2000b_rain_rate_piezo',rain_24h_entity:c.rain_24h_entity||w.rain_24h||'sensor.gw2000b_24h_rain_piezo',solar_entity:c.solar_entity||w.solar||'sensor.gw2000b_solar_radiation',"
          if old not in s: raise SystemExit('entity block not found')
          s=s.replace(old,new)

          old="setMap(p){this.map=p;this.updateMap()}\n updateMap(){const root=this.root;if(!root)return;const el=root.querySelector('.maphost');if(!el)return;const links={windy:this.windy(),wundermap:this.wunder(),sat24:this.c.sat24_url};let html='';if(this.map==='radar'){const u=this.radarUrl();html=u?'<div class=\"map\"><img src=\"'+u+'\" alt=\"Rain radar\"></div>':'<div class=\"empty\"><div><strong>Radar unavailable</strong>RainViewer has not returned radar coverage for this location.</div></div>'}else{const n={windy:'Windy',wundermap:'WunderMap',sat24:'SAT24'}[this.map];html='<div class=\"empty\"><div><strong>'+n+'</strong>Live interactive map is available externally.<br><small>This avoids iframe reload loops inside Home Assistant.</small></div></div>'}el.innerHTML=html;root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.map===this.map));const a=root.querySelector('.maplink');if(a){a.href=this.map==='radar'?'https://www.rainviewer.com/':links[this.map]||'#';a.textContent=this.map==='radar'?'RainViewer':'Open '+({windy:'Windy',wundermap:'WunderMap',sat24:'SAT24'}[this.map]||'map')}}"
          new="windyEmbed(){const q=this.coords(),z=Math.min(11,Math.max(3,this.c.windy_zoom));return 'https://embed.windy.com/embed2.html?lat='+q.lat.toFixed(4)+'&lon='+q.lon.toFixed(4)+'&zoom='+z+'&level=surface&overlay=wind&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&detailLat='+q.lat.toFixed(4)+'&detailLon='+q.lon.toFixed(4)+'&metricWind=km%2Fh&metricTemp=%C2%B0C'}\n setMap(p){if(this.map===p)return;this.map=p;this.updateMap()}\n createMapFrame(type){const host=this.root?.querySelector('.maphost');if(!host)return;const url=type==='windy'?this.windyEmbed():type==='wundermap'?this.wunder():this.c.sat24_url;const name={windy:'Windy',wundermap:'WunderMap',sat24:'SAT24'}[type]||'Weather Map';host.replaceChildren();const wrap=document.createElement('div');wrap.className='map';const iframe=document.createElement('iframe');iframe.src=url;iframe.title=name;iframe.loading='lazy';iframe.referrerPolicy='no-referrer-when-downgrade';wrap.appendChild(iframe);host.appendChild(wrap);this.mapFrame=iframe;this.mapFrameSrc=url}\n updateMap(){const root=this.root;if(!root)return;const el=root.querySelector('.maphost');if(!el)return;root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.map===this.map));const link=root.querySelector('.maplink');if(this.map==='radar'){this.mapFrame=null;this.mapFrameSrc='';const u=this.radarUrl();el.innerHTML=u?'<div class=\"map\"><img src=\"'+u+'\" alt=\"Rain radar\"></div>':'<div class=\"empty\"><div><strong>Radar unavailable</strong>RainViewer has not returned radar coverage for this location.</div></div>';if(link){link.href='https://www.rainviewer.com/';link.textContent='RainViewer'}}else{const url=this.map==='windy'?this.windyEmbed():this.map==='wundermap'?this.wunder():this.c.sat24_url;if(!this.mapFrame||this.mapFrameSrc!==url)this.createMapFrame(this.map);if(link){link.href=this.map==='windy'?this.windy():url;link.textContent='Open '+({windy:'Windy',wundermap:'WunderMap',sat24:'SAT24'}[this.map]||'map')}}}"
          if old not in s: raise SystemExit('map block not found')
          s=s.replace(old,new)

          old="<div class=\"wstat\"><span>Direction</span><strong id=\"wdir\">—</strong></div></div></div></section></div>"
          new="<div class=\"wstat\"><span>Direction</span><strong id=\"wdir\">—</strong></div><div class=\"wstat\"><span>Wind Chill</span><strong id=\"wchill\">—</strong></div></div></div></section></div>"
          if old in s: s=s.replace(old,new)

          s=s.replace("this.radarBusy=false}","this.radarBusy=false;this.mapFrame=null;this.mapFrameSrc=''}",1)

          old="set('wdir',compass);set('windread',deg==null?'—':Math.round(deg)+'° · '+this.v(i.ws)+' '+this.unit(i.ws,'km/h'));"
          new="set('wdir',compass);const wc=this.e(null,['windchill','wind chill']);set('wchill',this.temp(this.v(wc),this.unit(wc,'°C')));set('windread',deg==null?'—':Math.round(deg)+'° · '+this.v(i.ws)+' '+this.unit(i.ws,'km/h'));"
          if old in s: s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          Path('dist/weather-command-center.js').write_text(s,encoding='utf-8')
          PY
      - name: Commit patched card
        run: |
          rm -f .github/workflows/patch-weather.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weather-command-center.js dist/weather-command-center.js .github/workflows/patch-weather.yml
          git commit -m 'Fix weather maps and wind panel [weather-patch]'
          git push