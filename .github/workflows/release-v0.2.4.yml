name: Release v0.2.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release v0.2.4 already exists; nothing to do.'
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release version
        run: |
          sed -i 's/"version": "[^"]*"/"version": "0.2.4"/' package.json
          sed -i 's/\*\*v0.2.3 — bundled background loader fix\*\*/**v0.2.4 — layout redesign and expanded weather backgrounds**/' README.md
          sed -i 's#@v0.2.3/backgrounds/#@main/backgrounds/#g' README.md

      - name: Build distribution
        run: npm run build

      - name: Remove release trigger
        run: rm -f RELEASE-V0.2.4

      - name: Commit release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weather-command-center.js dist/weather-command-center.js package.json README.md RELEASE-V0.2.4
          git diff --cached --quiet || git commit -m 'Release v0.2.4'
          git push

      - name: Create v0.2.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4 \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "Weather Command Center v0.2.4" \
            --generate-notes
