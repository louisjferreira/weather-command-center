name: Use local weather backgrounds

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace background sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "sunny": "backgrounds/sunny.jpg",
              "partlycloudy": "backgrounds/partlycloudy.jpg",
              "cloudy": "backgrounds/cloudy.jpg",
              "rainy": "backgrounds/rainy.jpg",
              "storm": "backgrounds/storm.jpg",
              "night": "backgrounds/night.jpg",
              "snow": "backgrounds/snow.jpg",
          }

          for name in ["src/weather-command-center.js", "dist/weather-command-center.js"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              start = text.index("const BG={")
              end = text.index("};", start) + 2
              bg = "const BG={" + ",".join(f"{k}:\"/{v}\"" for k, v in replacements.items()) + "};"
              text = text[:start] + bg + text[end:]
              p.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/weather-command-center.js dist/weather-command-center.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: use local weather background scenes"
          git push
