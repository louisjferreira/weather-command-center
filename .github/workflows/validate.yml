name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check source syntax
        run: node --check src/weather-command-center.js

      - name: Check distribution syntax
        run: node --check dist/weather-command-center.js
