name: Fix Compass Syntax Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix wind compass syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/weather-command-center.js')
          s=p.read_text(encoding='utf-8')
          start=s.find("const rose=root.getElementById('rose');if(rose){")
          end=s.find("const shell=root.querySelector('.shell'),bg=this.bgUrl(cond);", start)
          if start < 0 or end < 0:
              raise SystemExit('Compass block not found')
          rose='''const rose=root.getElementById('rose');if(rose){const d=deg==null?0:((deg%360)+360)%360,r=78,cx=102,cy=102,rad=d*Math.PI/180,x=cx+r*Math.sin(rad),y=cy-r*Math.cos(rad),vx=Math.sin(rad),vy=-Math.cos(rad),px=Math.cos(rad),py=Math.sin(rad),baseX=x-13*vx,baseY=y-13*vy,hx=7*px,hy=7*py;rose.innerHTML='<svg viewBox="0 0 204 204" aria-label="Wind direction"><circle class="ring" cx="102" cy="102" r="28"/><circle class="ring" cx="102" cy="102" r="52"/><circle class="ring" cx="102" cy="102" r="78"/><line class="axis" x1="24" y1="102" x2="180" y2="102"/><line class="axis" x1="102" y1="24" x2="102" y2="180"/><text x="99" y="14">N</text><text x="190" y="106">E</text><text x="99" y="198">S</text><text x="8" y="106">W</text><line class="arrow" x1="102" y1="102" x2="'+x+'" y2="'+y+'"/><polygon class="head" points="'+x+','+y+' '+(baseX-hx)+','+(baseY-hy)+' '+(baseX+hx)+','+(baseY+hy)+'"/><circle class="center" cx="102" cy="102" r="5"/></svg>'}}'''
          p.write_text(s[:start]+rose+s[end:],encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          node --check src/weather-command-center.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/weather-command-center.js
          git commit -m "Fix wind compass syntax"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-compass-syntax-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary compass syntax workflow"
          git push
