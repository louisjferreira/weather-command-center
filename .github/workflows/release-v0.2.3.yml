name: Release v0.2.3 background loader fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v0.2.3]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix bundled background URLs
        run: |
          sed -i 's#/local/community/weather-command-center/backgrounds/#https://cdn.jsdelivr.net/gh/louisjferreira/weather-command-center@v0.2.3/backgrounds/#g' src/weather-command-center.js
          sed -i 's#/local/community/weather-command-center/backgrounds/#https://cdn.jsdelivr.net/gh/louisjferreira/weather-command-center@v0.2.3/backgrounds/#g' dist/weather-command-center.js
          sed -i 's#"version": "[^"]*"#"version": "0.2.3"#' package.json
          sed -i 's#v0.2.2 — background asset path fix#v0.2.3 — bundled background loader fix#' README.md
          sed -i 's#loaded automatically by the card through Home Assistant.s local static-file path:#loaded automatically from the Weather Command Center GitHub release:#' README.md
          sed -i 's#/local/community/weather-command-center/backgrounds/<background>.jpg#https://cdn.jsdelivr.net/gh/louisjferreira/weather-command-center@v0.2.3/backgrounds/<background>.jpg#' README.md

      - name: Build distribution
        run: npm run build

      - name: Remove release trigger
        run: rm -f RELEASE-V0.2.3

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weather-command-center.js dist/weather-command-center.js package.json README.md RELEASE-V0.2.3
          git diff --cached --quiet || git commit -m 'Release v0.2.3 background loader fix'
          git push

      - name: Create v0.2.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.3 \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "Weather Command Center v0.2.3" \
            --generate-notes
