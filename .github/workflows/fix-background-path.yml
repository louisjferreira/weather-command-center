name: Fix background asset paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["src/weather-command-center.js", "dist/weather-command-center.js"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = text.replace('"/backgrounds/', '"/hacsfiles/weather-command-center/backgrounds/')
              p.write_text(text, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add src/weather-command-center.js dist/weather-command-center.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: load bundled weather backgrounds through HACS"
          git push
