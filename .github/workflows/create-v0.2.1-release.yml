name: Create v0.2.1 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v0.2.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Weather Command Center v0.2.1" \
            --generate-notes
