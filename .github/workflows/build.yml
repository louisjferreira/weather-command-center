name: Build distribution

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair forecast day helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/weather-command-center.js')
          s = p.read_text()
          if '_day(v)' not in s:
              marker = "_tempUnit(id,a){return String(this._unit(id,a?.temperature_unit||'°C')).replace(/^°/,'')}"
              helper = "_day(v){try{return new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(new Date(v))}catch(e){return'—'}}\n"
              if marker not in s:
                  raise SystemExit('Could not find insertion point for _day helper')
              p.write_text(s.replace(marker, helper + marker, 1))
          PY

      - name: Build distribution
        run: npm run build

      - name: Commit distribution and source repair
        run: |
          if git diff --quiet -- src/weather-command-center.js dist/weather-command-center.js; then
            echo 'Distribution and source are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weather-command-center.js dist/weather-command-center.js
          git commit -m 'Fix forecast day rendering'
          git push
