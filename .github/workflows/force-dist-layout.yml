name: Force distribution layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'fix: force compact wind layout')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dist with regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dist/weather-command-center.js')
          s=p.read_text()
          rules=[
            (r'\.grid\{display:grid;grid-template-columns:[^;]+;gap:13px;margin-bottom:13px;align-items:stretch\}', '.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:13px;margin-bottom:13px;align-items:stretch}'),
            (r'\.panel\{min-height:[^;]+;height:[^;]+;box-sizing:border-box\}', '.panel{min-height:360px;height:360px;box-sizing:border-box}'),
            (r'\.map\{height:[0-9]+px;', '.map{height:300px;'),
            (r'\.empty\{height:[0-9]+px;', '.empty{height:300px;'),
            (r'\.windbox\{height:[0-9]+px;', '.windbox{height:145px;'),
            (r'\.windbox svg\{width:[0-9]+px;height:[0-9]+px;', '.windbox svg{width:145px;height:145px;'),
            (r'\.wind-side strong\{display:block;font-size:[0-9]+px;', '.wind-side strong{display:block;font-size:22px;'),
          ]
          for pat,repl in rules:
              s,n=re.subn(pat,repl,s,count=1)
              print(pat,n)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/weather-command-center.js
          git commit -m 'fix: force compact wind layout'
          git push
