name: Rebuild Distribution Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, 'Rebuild distribution after Windy compass fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build distribution
        run: node scripts/build.mjs

      - name: Commit distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/weather-command-center.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild distribution after Windy compass fix"
          git pull --rebase origin main
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/rebuild-dist-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary distribution workflow"
          git push
