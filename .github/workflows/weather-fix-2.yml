name: Repair Weather Wind Logic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'fix: weather wind logic')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wind source and travel direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/weather-command-center.js')
          s=p.read_text()
          old="const deg=this.n(i.wd);const compass=deg==null?'—':['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];set('dir',travelDeg==null?'—':Math.round(travelDeg)+'°');"
          new="const deg=this.n(i.wd);const sourceCompass=deg==null?'—':['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];const travelDeg=deg==null?null:(deg+180)%360;const compass=travelDeg==null?'—':['N','NE','E','SE','S','SW','W','NW'][Math.round(travelDeg/45)%8];set('dir',travelDeg==null?'—':Math.round(travelDeg)+'°');"
          if old not in s:
              raise SystemExit('Expected broken wind-direction line was not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build dist
        run: node scripts/build.mjs
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weather-command-center.js dist/weather-command-center.js
          git rm .github/workflows/weather-fix-2.yml
          git commit -m 'fix: weather wind logic'
          git push