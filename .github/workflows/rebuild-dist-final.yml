name: Final Distribution Rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, 'Rebuild distribution for Windy compass fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and build distribution
        run: |
          node --check src/weather-command-center.js
          node scripts/build.mjs
          node --check dist/weather-command-center.js
      - name: Commit distribution and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/weather-command-center.js
          git commit -m "Rebuild distribution for Windy compass fix"
          git rm .github/workflows/rebuild-dist-final.yml
          git commit -m "Remove temporary distribution rebuild workflow"
          git push
